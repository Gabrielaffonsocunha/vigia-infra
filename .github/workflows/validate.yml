name: Validar laboratório
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar Docker Compose
        run: docker compose config --quiet
      - name: Validar Prometheus e regras
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" prom/prometheus:v2.55.1 promtool check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/prometheus/rules:/etc/prometheus/rules:ro" prom/prometheus:v2.55.1 promtool check rules /etc/prometheus/rules/availability.yml
      - name: Validar JSON do dashboard
        run: python -m json.tool grafana/dashboards/vigia-infra.json > /dev/null
