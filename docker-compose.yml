name: vigia-infra
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: vigia-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks: [monitoring]
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: vigia-blackbox
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    ports: ["127.0.0.1:9115:9115"]
    volumes: ["./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro"]
    restart: unless-stopped
    networks: [monitoring]
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: vigia-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    pid: host
    read_only: true
    volumes: ["/:/host:ro,rslave"]
    restart: unless-stopped
    networks: [monitoring]
  grafana:
    image: grafana/grafana:11.3.0
    container_name: vigia-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-troque-esta-senha}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [monitoring]
volumes:
  prometheus_data:
  grafana_data:
networks:
  monitoring:
    name: vigia-monitoring
